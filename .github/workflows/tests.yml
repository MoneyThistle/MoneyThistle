# Run the tests on every change, on Windows and Linux; and check the container image builds and
# starts (the one each release publishes for Docker and Unraid).
name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        env:
          NO_SHORTCUTS: "1"
        run: python -W ignore -m unittest discover -s tests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image and check that it starts
        run: |
          docker build -t moneythistle:test .
          docker run -d --name mt -p 8080:8080 -e APP_USERNAME=admin -e APP_PASSWORD=check-only-123 moneythistle:test
          ok=""
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8080/healthz >/dev/null; then ok=1; break; fi
            sleep 2
          done
          docker logs mt
          [ -n "$ok" ] || { echo "The container didn't answer"; exit 1; }
          curl -fs http://127.0.0.1:8080/api/meta
