# MoneyThistle with Docker Compose: the image each release publishes on GitHub.
#   docker compose up -d                          start it (http://SERVER:8080)
#   docker compose pull && docker compose up -d   update it to the newest release
# To stay on one version, change :latest to a version number, like :1.0.0 (only that version)
# or :1.0 (its fixes too).
services:
  moneythistle:
    image: ghcr.io/moneythistle/moneythistle:latest
    container_name: moneythistle
    restart: unless-stopped
    ports:
      # Reachable from your network and Tailscale at http://SERVER:8080
      - "8080:8080"
    environment:
      TZ: "America/New_York"
      PUID: "1000"        # the user that owns ./data and ./backups (Unraid: 99)
      PGID: "1000"        # its group (Unraid: 100)
      # Only shown in the app's Settings, in place of /data and /backups.
      HOST_DATA_DIR: "./data"
      HOST_BACKUP_DIR: "./backups"
      # Optional: the first administrator, created on the very first start only.
      # Leave these out to create it in the browser instead (do that right away).
      # Everyone else gets their own sign-in under People in the app.
      # APP_USERNAME: "admin"
      # APP_PASSWORD: "choose-a-password"
      # Optional: set the Nextcloud / WebDAV backup here instead of in the app.
      # WEBDAV_URL: "https://cloud.example.com/remote.php/dav/files/USERNAME/Backups/Money"
      # WEBDAV_USER: "USERNAME"
      # WEBDAV_PASSWORD: "app-password-from-nextcloud"
    volumes:
      - ./data:/data
      - ./backups:/backups
    stop_grace_period: 60s
