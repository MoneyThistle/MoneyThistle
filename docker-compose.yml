services:
  moneythistle:
    build: .
    image: moneythistle:latest
    container_name: moneythistle
    restart: unless-stopped
    ports:
      # Reachable from your network and Tailscale at http://SERVER:8080
      - "8080:8080"
    environment:
      TZ: "America/New_York"
      PUID: "99"          # Unraid: nobody
      PGID: "100"         # Unraid: users
      CURRENCY_SYMBOL: "$"
      # Only shown in the app's Settings, in place of /app, /data and /backups.
      HOST_APP_DIR: "this folder (beside docker-compose.yml)"
      HOST_DATA_DIR: "./data"
      HOST_BACKUP_DIR: "./backups"
      # Optional: the first administrator, created on the very first start only.
      # Leave these out to create it in the browser instead (do that right away).
      # Everyone else gets their own sign-in under People in the app.
      APP_USERNAME: "admin"
      APP_PASSWORD: "change-me-please"
      # Optional: set the Nextcloud / WebDAV backup here instead of in the app.
      # WEBDAV_URL: "https://cloud.example.com/remote.php/dav/files/USERNAME/Backups/Money"
      # WEBDAV_USER: "USERNAME"
      # WEBDAV_PASSWORD: "app-password-from-nextcloud"
    volumes:
      - ./data:/data
      - ./backups:/backups
      # The app's own files, read-only: after updating this folder, the
      # "Restart MoneyThistle" button (Settings) starts the new version.
      - ./:/app:ro
    stop_grace_period: 60s
